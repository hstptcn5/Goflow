name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: goflow-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLOW_CI_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  change-classification:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -u
          docs_only=false
          base_sha=""
          head_sha="$CURRENT_SHA"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "docs_only=false"
              echo "base_sha="
              echo "head_sha=$head_sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base_sha="$PUSH_BEFORE_SHA"
          else
            {
              echo "docs_only=false"
              echo "base_sha="
              echo "head_sha=$head_sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=""
          diff_ok=true
          if [ "$EVENT_NAME" = "push" ] && [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            changed_files="$(git diff-tree --root --no-commit-id --name-only -r "$head_sha")" || { changed_files=""; diff_ok=false; }
          else
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")" || { changed_files=""; diff_ok=false; }
          fi

          base_ok=false
          head_ok=false
          if [ -n "$base_sha" ] && git rev-parse --verify "$base_sha^{commit}" >/dev/null 2>&1; then
            base_ok=true
          fi
          if git rev-parse --verify "$head_sha^{commit}" >/dev/null 2>&1; then
            head_ok=true
          fi

          if [ "$diff_ok" = true ] && [ "$base_ok" = true ] && [ "$head_ok" = true ] && [ -n "$changed_files" ]; then
            docs_only=true
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                .github/workflows/*|examples/packs/*) docs_only=false; break ;;
                README.md|docs/*|*.md|LICENSE|TRADEMARK.md|COMMERCIAL.md|CHANGELOG.md) ;;
                *) docs_only=false; break ;;
              esac
            done <<< "$changed_files"
          fi

          {
            echo "docs_only=$docs_only"
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

  documentation:
    name: Documentation checks
    runs-on: ubuntu-latest
    needs: change-classification
    if: needs.change-classification.outputs.docs_only == 'true'
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.change-classification.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify exact checkout and diff commits
        env:
          BASE_SHA: ${{ needs.change-classification.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change-classification.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git rev-parse --verify "$BASE_SHA^{commit}" >/dev/null
          git rev-parse --verify "$HEAD_SHA^{commit}" >/dev/null

      - name: Check documentation diff
        env:
          BASE_SHA: ${{ needs.change-classification.outputs.base_sha }}
          HEAD_SHA: ${{ needs.change-classification.outputs.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: change-classification
    if: needs.change-classification.outputs.docs_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GOFLOW_CI_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: |
          packages=$(go list ./... | grep -v '/release/')
          go vet $packages

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: change-classification
    if: needs.change-classification.outputs.docs_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GOFLOW_CI_COMMIT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Test
        working-directory: ui
        run: npm run test

      - name: Build
        working-directory: ui
        run: npm run build

  appliance-e2e:
    name: Appliance Playwright E2E
    runs-on: ubuntu-latest
    needs:
      - change-classification
      - backend
      - frontend
    if: needs.change-classification.outputs.docs_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GOFLOW_CI_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: ui
        run: npm run test:e2e -- appliance.spec.js

      - name: Run DailyOps appliance E2E
        working-directory: ui
        run: npm run test:e2e:dailyops

      - name: Runner smoke
        working-directory: ui
        run: npm run test:e2e:runner

  pack-contracts:
    name: Pack contracts and DailyOps
    runs-on: ubuntu-latest
    needs:
      - change-classification
      - backend
    if: needs.change-classification.outputs.docs_only != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GOFLOW_CI_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pack CLI tests
        run: go test ./internal/cli ./internal/pack ./internal/packrun

      - name: Community artifact contract tests
        run: go test ./internal/buildinfo ./internal/communityartifact ./internal/storage

      - name: DailyOps validate and offline test
        run: |
          go run . pack validate examples/packs/dailyops-rest-telegram
          go run . pack test examples/packs/dailyops-rest-telegram --output json

      - name: DailyOps deterministic build and scan
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          go build -trimpath -ldflags="-s -w" -o "$tmp/goflow" main.go static_embed.go
          mkdir -p "$tmp/out1" "$tmp/out2" "$tmp/extract"
          "$tmp/goflow" pack build examples/packs/dailyops-rest-telegram --output "$tmp/out1"
          "$tmp/goflow" pack build examples/packs/dailyops-rest-telegram --output "$tmp/out2"
          archive1="$(find "$tmp/out1" -name '*.zip' -print -quit)"
          archive2="$(find "$tmp/out2" -name '*.zip' -print -quit)"
          sha1="$(sha256sum "$archive1" | cut -d' ' -f1)"
          sha2="$(sha256sum "$archive2" | cut -d' ' -f1)"
          test "$sha1" = "$sha2"
          unzip -q "$archive1" -d "$tmp/extract"
          "$tmp/goflow" pack verify "$archive1" --output json
          "$tmp/goflow" pack verify "$tmp/extract" --output json
          if find "$tmp/extract" -type f \( -name 'goflow.db' -o -name '*.key' -o -name '.env' -o -name 'pack-config.json' -o -name 'pack-credentials.json' \) | grep -q .; then
            echo "bundle contains forbidden runtime state"
            exit 1
          fi
          if grep -R -I -E 'fake-telegram-value|dailyops-test-master-key|/home/runner|/tmp/|C:\\Users\\runneradmin|C:\\Users\\RUNNER~1' "$tmp/extract"; then
            echo "bundle scan found forbidden canary/path material"
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - change-classification
      - backend
      - frontend
      - pack-contracts
    if: needs.change-classification.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}
          fetch-depth: 0

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GOFLOW_CI_COMMIT"

      - name: Read canonical Community version
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          echo "GOFLOW_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/community-runtime" dist
          channel="community-rc"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            channel="development"
          fi
          ldflags="-s -w -X goflow/internal/buildinfo.BuildVersion=$GOFLOW_RELEASE_VERSION -X goflow/internal/buildinfo.BuildChannel=$channel -X goflow/internal/buildinfo.BuildCommit=$GOFLOW_CI_COMMIT -X goflow/internal/buildinfo.BuildTarget=${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath -ldflags="$ldflags" -o "$RUNNER_TEMP/community-runtime/goflow${{ matrix.ext }}" main.go static_embed.go

      - name: Build and verify Community RC artifact
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          go run ./internal/testharness/communityrc build \
            --runtime "$RUNNER_TEMP/community-runtime/goflow${{ matrix.ext }}" \
            --license LICENSE \
            --output dist \
            --commit "$GOFLOW_CI_COMMIT" \
            --target "${{ matrix.goos }}-${{ matrix.goarch }}"
          go run ./internal/testharness/communityrc verify \
            --archive "dist/goflow-community-${GOFLOW_RELEASE_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" \
            --commit "$GOFLOW_CI_COMMIT" \
            --target "${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Verify canonical determinism
        if: github.event_name != 'workflow_dispatch' && matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/community-second"
          go run ./internal/testharness/communityrc build \
            --runtime "$RUNNER_TEMP/community-runtime/goflow" \
            --license LICENSE \
            --output "$RUNNER_TEMP/community-second" \
            --commit "$GOFLOW_CI_COMMIT" \
            --target linux-amd64
          cmp \
            "dist/goflow-community-${GOFLOW_RELEASE_VERSION}-linux-amd64.zip" \
            "$RUNNER_TEMP/community-second/goflow-community-${GOFLOW_RELEASE_VERSION}-linux-amd64.zip"

      - name: Run canonical extracted-runtime smoke and restart test
        if: github.event_name != 'workflow_dispatch' && matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go run ./internal/testharness/communityrc smoke \
            --archive "dist/goflow-community-${GOFLOW_RELEASE_VERSION}-linux-amd64.zip" \
            --commit "$GOFLOW_CI_COMMIT" \
            --target linux-amd64

      - name: Run exact Beta-to-RC upgrade compatibility test
        if: github.event_name != 'workflow_dispatch' && matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GOFLOW_BETA_BASE_COMMIT: 66fe7993f99aeac32339324dd07f58f47ad1f940
        run: |
          set -euo pipefail
          base_source="$RUNNER_TEMP/goflow-beta-source"
          mkdir -p "$base_source"
          git archive "$GOFLOW_BETA_BASE_COMMIT" | tar -xf - -C "$base_source"
          (
            cd "$base_source"
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/goflow-beta" main.go static_embed.go
          )
          go run ./internal/testharness/communityrc upgrade \
            --base-runtime "$RUNNER_TEMP/goflow-beta" \
            --base-commit "$GOFLOW_BETA_BASE_COMMIT" \
            --archive "dist/goflow-community-${GOFLOW_RELEASE_VERSION}-linux-amd64.zip" \
            --commit "$GOFLOW_CI_COMMIT" \
            --target linux-amd64

      - name: Upload Community RC artifact
        if: github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-COMMUNITY-RC-goflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/goflow-community-*-${{ matrix.goos }}-${{ matrix.goarch }}.zip
            dist/goflow-community-*-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
          if-no-files-found: error

  windows-pilot:
    name: Windows DailyOps pilot appliance
    runs-on: windows-latest
    needs:
      - change-classification
      - backend
      - frontend
      - appliance-e2e
      - pack-contracts
    if: needs.change-classification.outputs.docs_only != 'true'
    steps:
      - name: Checkout exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}

      - name: Verify exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GOFLOW_CI_COMMIT) {
            throw 'workflow checkout does not match the pull request head'
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies and build embedded UI
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install chromium

      - name: Build native DailyOps E2E harness
        shell: pwsh
        run: >-
          go build -trimpath
          -o "${{ runner.temp }}/dailyops-appliance-harness.exe"
          ./internal/testharness/dailyopsappliance

      - name: Run native Windows DailyOps setup and persistence E2E
        working-directory: ui
        env:
          GOFLOW_DAILYOPS_HARNESS_BINARY: ${{ runner.temp }}/dailyops-appliance-harness.exe
        run: npm run test:e2e:dailyops

      - name: Build and verify native Windows pilot artifact
        shell: pwsh
        run: >-
          ./scripts/build-windows-pilot.ps1
          -OutputDirectory "${{ runner.temp }}/windows-pilot-artifact"
          -Commit "${{ env.GOFLOW_CI_COMMIT }}"

      - name: Upload unsigned Windows pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-PILOT-BETA-goflow-dailyops-windows-amd64
          path: ${{ runner.temp }}/windows-pilot-artifact/
          if-no-files-found: error

  development-artifacts:
    name: Unsigned development artifacts ${{ matrix.goos }}-${{ matrix.goarch }}
    needs:
      - change-classification
      - backend
      - frontend
      - appliance-e2e
      - pack-contracts
    if: github.event_name == 'workflow_dispatch' && needs.change-classification.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            build_dailyops: "true"
          - goos: linux
            goarch: arm64
            ext: ""
            build_dailyops: "false"
          - goos: windows
            goarch: amd64
            ext: ".exe"
            build_dailyops: "false"
          - goos: darwin
            goarch: amd64
            ext: ""
            build_dailyops: "false"
          - goos: darwin
            goarch: arm64
            ext: ""
            build_dailyops: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_CI_COMMIT }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GOFLOW_CI_COMMIT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build unsigned runtime
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/goflow-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" main.go static_embed.go

      - name: Build DailyOps development bundle
        if: matrix.build_dailyops == 'true'
        run: |
          ./dist/goflow-${{ matrix.goos }}-${{ matrix.goarch }} pack build examples/packs/dailyops-rest-telegram --output dist --force

      - name: Write checksums and metadata
        run: |
          {
            echo "UNSIGNED-DEVELOPMENT-ALPHA"
            echo "commit=${GOFLOW_CI_COMMIT}"
            echo "target=${{ matrix.goos }}-${{ matrix.goarch }}"
            date -u +"built_at=%Y-%m-%dT%H:%M:%SZ"
          } > dist/UNSIGNED-DEVELOPMENT-ALPHA.txt
          sha256sum dist/* > "dist/SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - name: Upload unsigned development artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-DEVELOPMENT-ALPHA-goflow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
