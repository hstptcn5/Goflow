name: Roadmap branch gofmt autofix

on:
  push:
    branches:
      - goflow-phase01-workflow-language

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ !contains(github.event.head_commit.message, 'chore: gofmt roadmap branch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@v4
        with:
          ref: goflow-phase01-workflow-language
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format Go sources
        run: gofmt -w .
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "chore: gofmt roadmap branch"
          git push origin HEAD:goflow-phase01-workflow-language
