name: Daily Business Report Public Beta

on:
  pull_request:
    paths:
      - 'examples/packs/daily-business-report/**'
      - 'internal/pack/**'
      - 'internal/nodes/**'
      - 'ui/src/components/ApplianceApp.vue'
      - 'ui/src/components/applianceI18n.js'
      - 'scripts/build-daily-business-report*.ps1'
      - '.github/workflows/daily-business-report.yml'

permissions:
  contents: read

env:
  GOFLOW_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  windows-validation:
    name: Windows bilingual flagship validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOFLOW_RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Verify exact checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:GOFLOW_RELEASE_COMMIT) { throw 'checkout does not match requested commit' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build and verify bilingual Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path checkpoint-i-artifact | Out-Null
          .\scripts\build-daily-business-report-current.ps1 -OutputDirectory (Resolve-Path checkpoint-i-artifact).Path -Commit $env:GOFLOW_RELEASE_COMMIT
      - name: Upload verified validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: CHECKPOINT-I-VALIDATION-daily-business-report-windows-amd64
          path: checkpoint-i-artifact/**
          if-no-files-found: error
          retention-days: 7
